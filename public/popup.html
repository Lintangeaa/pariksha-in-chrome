<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Pariksha Recorder</title>
    <style>
      body {
        width: 280px;
        font-family: system-ui, sans-serif;
        padding: 12px;
      }
      label {
        display: block;
        margin-top: 8px;
        font-size: 12px;
        color: #555;
      }
      input,
      select,
      button {
        width: 100%;
        box-sizing: border-box;
        padding: 6px;
        margin-top: 2px;
      }
      #status {
        margin-top: 10px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="login-view">
      <label for="email">Email</label>
      <input id="email" type="email" />
      <label for="password">Password</label>
      <input id="password" type="password" />
      <button id="login-button" type="button">Login</button>
      <div id="login-error" style="color: red; font-size: 12px"></div>
    </div>

    <div id="recording-view" style="display: none">
      <label for="workspace-select">Workspace</label>
      <select id="workspace-select"></select>
      <label for="pb-select">PB</label>
      <select id="pb-select"></select>
      <button id="start-button" type="button" disabled>Mulai Rekam</button>
      <button id="stop-button" type="button" style="display: none">Stop</button>
      <div id="status"></div>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
